<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ShopKe</title>

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #0B0F14;
  color: #fff;
}

/* Top bar */
.nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 40px;
  background: #0B0F14;
  border-bottom: 1px solid #1f2a36;
}

.logo {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 1px;
}

.tag {
  color: #B8C0CC;
  font-size: 12px;
}

/* Hero */
.hero {
  text-align: center;
  padding: 60px 20px;
}

.hero h1 {
  font-size: 40px;
  margin-bottom: 10px;
}

.hero p {
  color: #B8C0CC;
}

/* Product card */
.card {
  background: #161C24;
  margin: 30px auto;
  width: 320px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #1f2a36;
}

.card img {
  width: 100%;
}

.card-body {
  padding: 15px;
}

.price {
  color: #1DB954;
  font-weight: bold;
  margin: 10px 0;
}

/* Button */
.btn {
  width: 100%;
  padding: 12px;
  border: none;
  background: #D72638;
  color: white;
  font-weight: bold;
  cursor: pointer;
  border-radius: 8px;
}

.btn:hover {
  opacity: 0.9;
}

/* Footer */
.footer {
  text-align: center;
  color: #556070;
  font-size: 12px;
  margin: 40px 0;
}
</style>
</head>

<body>

<div class="nav">
  <div class="logo">ShopKe</div>
  <div class="tag">Secure Commerce Platform</div>
</div>

<div class="hero">
  <h1>Safe Shopping for TikTok Sellers</h1>
  <p>Pay securely. Track orders. Pick up with confidence.</p>
</div>

<div class="card">
  <img src="https://via.placeholder.com/400x300">

  <div class="card-body">
    <h3>Magic Cleaning Brush</h3>
    <div class="price">KES 1500</div>

    <a href="product.html">
      <button class="btn">Pay via M-Pesa</button>
    </a>
  </div>
</div>

<div class="footer">
  ShopKe • Secure Marketplace for Kenya
</div>

</body>
</html>
