<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ShopKe - Product</title>

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #0B0F14;
  color: #fff;
}

/* Top bar */
.nav {
  display: flex;
  justify-content: space-between;
  padding: 18px 30px;
  border-bottom: 1px solid #1f2a36;
}

.logo {
  font-weight: 700;
  font-size: 18px;
}

.secure {
  font-size: 12px;
  color: #B8C0CC;
}

/* Container */
.container {
  display: flex;
  justify-content: center;
  padding: 40px 20px;
}

/* Card */
.card {
  width: 380px;
  background: #161C24;
  border: 1px solid #1f2a36;
  border-radius: 14px;
  overflow: hidden;
}

/* Image */
.card img {
  width: 100%;
}

/* Content */
.content {
  padding: 18px;
}

.title {
  font-size: 20px;
  font-weight: 600;
}

.desc {
  color: #B8C0CC;
  font-size: 13px;
  margin-top: 5px;
}

.price {
  margin-top: 12px;
  font-size: 18px;
  color: #1DB954;
  font-weight: 700;
}

/* Input */
input {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border-radius: 8px;
  border: 1px solid #1f2a36;
  background: #0B0F14;
  color: #fff;
}

/* Button */
.btn {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  background: #D72638;
  color: white;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
}

.btn:hover {
  opacity: 0.9;
}

/* Trust badge */
.badge {
  margin-top: 12px;
  font-size: 11px;
  color: #B8C0CC;
  text-align: center;
}

/* Footer */
.footer {
  text-align: center;
  font-size: 11px;
  color: #556070;
  margin: 30px 0;
}
</style>
</head>

<body>

<div class="nav">
  <div class="logo">ShopKe</div>
  <div class="secure">Secure Checkout</div>
</div>

<div class="container">
  <div class="card">

    <img src="https://via.placeholder.com/500x350">

    <div class="content">
      <div class="title">Magic Cleaning Brush</div>
      <div class="desc">High-efficiency cleaning tool for home use</div>

      <div class="price">KES 1500</div>

      <input type="text" id="phone" placeholder="Enter M-Pesa number">

      <button class="btn" onclick="payNow()">
        Pay via M-Pesa
      </button>

      <div class="badge">
        Protected checkout • ShopKe holds payment until pickup
      </div>
    </div>

  </div>
</div>

<div class="footer">
  ShopKe • Secure Marketplace for Kenya
</div>

<script>
function payNow() {
  const phone = document.getElementById("phone").value;

  if (!phone) {
    alert("Enter M-Pesa number");
    return;
  }

  alert("Order created. Proceed with M-Pesa payment flow next.");
}
</script>

</body>
</html>
